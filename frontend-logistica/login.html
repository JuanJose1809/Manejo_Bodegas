<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Manejo de Bodega</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            margin-top: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .volver {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
        .volver:hover {
            text-decoration: underline;
        }
        /* Estilo para mensajes de error limpios sin alertas molestas */
        .error-msg {
            color: #dc3545;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Manejo de Bodega</h2>
        <form id="formLogin">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" required placeholder="Ingresa tu usuario">

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" required placeholder="••••••••">

            <button type="submit">Ingresar</button>
            <div id="errorMsg" class="error-msg">Usuario o contraseña incorrectos</div>
        </form>
        <a href="index.html" class="volver">← Volver al inicio</a>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('contrasena').value;
            const errorDiv = document.getElementById('errorMsg');

            // Validación de acceso
            if (user === 'hermana' && pass === '1234') {
                // Redirección directa y limpia sin alertas de Windows
                window.location.href = 'dashboard.html'; 
            } else {
                // Muestra un texto sutil en lugar de una ventana emergente molesta
                errorDiv.style.display = 'block';
            }
        });
    </script>

</body>
</html>
