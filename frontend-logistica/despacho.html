<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Despacho</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        label { font-weight: bold; font-size: 14px; margin-bottom: 5px; display: block; color: #555; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { width: 100%; background-color: #007bff; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
        
        /* Estilos para el mensaje de éxito */
        .pantalla-exito { display: none; text-align: center; padding: 40px 10px; }
        .icono-check { font-size: 50px; color: #28a745; margin-bottom: 15px; }
        .pantalla-exito h3 { color: #28a745; margin: 0 0 10px 0; }
        .pantalla-exito p { color: #666; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Formulario de Registro -->
        <div id="seccionFormulario">
            <h2>Registrar Despacho</h2>
            <form id="formDespacho">
                <label for="fecha">Fecha de Despacho</label>
                <input type="date" id="fecha" required>

                <label for="cliente">Cliente de Destino</label>
                <input type="text" id="cliente" placeholder="Ej: Empresa XYZ" required>

                <label for="chofer">Nombre del Chofer</label>
                <input type="text" id="chofer" placeholder="Ej: Carlos Pérez" required>

                <label for="ciudad">Ciudad de Destino</label>
                <input type="text" id="ciudad" placeholder="Ej: Medellín" required>

                <label for="lote">Número de Lote</label>
                <input type="text" id="lote" placeholder="Ej: LOTE-01" required>

                <label for="toneladas">Cantidad de Toneladas</label>
                <small style="color: #666; font-size: 12px; display: block; margin-bottom: 8px;">* Usa el punto o la coma para los decimales</small>
                <input type="number" step="0.01" id="toneladas" placeholder="Ej: 12.5" required>

                <button type="submit">Guardar Despacho</button>
            </form>
            <a href="dashboard.html" class="back-link">← Volver al Panel</a>
        </div>

        <!-- Pantalla de Éxito (Oculta por defecto) -->
        <div id="seccionExito" class="pantalla-exito">
            <div class="icono-check">✅</div>
            <h3>¡Despacho Guardado!</h3>
            <p>La información ha sido registrada correctamente en el sistema.</p>
            <p style="font-size: 12px; margin-top: 20px;">Redirigiendo al panel de control...</p>
        </div>
    </div>

    <script>
        document.getElementById('formDespacho').addEventListener('submit', async function(event) {
            event.preventDefault();

            const datosDespacho = {
                fechaDespacho: document.getElementById('fecha').value,
                clienteDestino: document.getElementById('cliente').value,
                nombreConductor: document.getElementById('chofer').value, 
                ciudadDestino: document.getElementById('ciudad').value,
                lote: document.getElementById('lote').value,
                toneladas: parseFloat(document.getElementById('toneladas').value)
            };

            try {
                const respuesta = await fetch('http://localhost:8080/api/despachos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datosDespacho)
                });

                if (respuesta.ok) {
                    // Ocultar formulario y mostrar éxito
                    document.getElementById('seccionFormulario').style.display = 'none';
                    document.getElementById('seccionExito').style.display = 'block';

                    // Esperar 3 segundos y redirigir al Dashboard
                    setTimeout(function() {
                        window.location.href = 'dashboard.html';
                    }, 3000);
                } else {
                    alert('Error al guardar el despacho en el servidor.');
                }
            } catch (error) {
                console.error('Error de red:', error);
                alert('No se pudo conectar con el servidor.');
            }
        });
    </script>
</body>
</html>
